name: docker
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: checkout master
        uses: actions/checkout@v2
        with:
          ref: master

      - name: login aliyuncs
        uses: docker/login-action@v2
        with:
          registry: ${{ secrets.DOCKER_REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: build and push docker image to aliyuncs
        run: |
          docker build \
            --build-arg VUE_APP_OAUTH_SERVER_URL="${{ secrets.VUE_APP_OAUTH_SERVER_URL || 'http://127.0.0.1:8090' }}" \
            --build-arg VUE_APP_OAUTH_CLIENT_ID="${{ secrets.VUE_APP_OAUTH_CLIENT_ID || '' }}" \
            --build-arg VUE_APP_OAUTH_CLIENT_SECRET="${{ secrets.VUE_APP_OAUTH_CLIENT_SECRET || '' }}" \
            --build-arg VUE_APP_OAUTH_REDIRECT_URI="${{ secrets.VUE_APP_OAUTH_REDIRECT_URI || '' }}" \
            --build-arg VUE_APP_OAUTH_SCOPE="${{ secrets.VUE_APP_OAUTH_SCOPE || 'read write' }}" \
            -t ${{ secrets.DOCKER_REGISTRY }}/swxs/openapi_user \
            .
          docker push ${{ secrets.DOCKER_REGISTRY }}/swxs/openapi_user
